<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verification Unlock</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .title-badge {
      background: rgba(30, 41, 59, 0.9);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Code Display Boxes */
    .pin-container {
      display: flex;
      gap: 8px;
    }

    .pin-box {
      width: 48px;
      height: 56px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    /* Keypad Grid */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }

    .num-btn {
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      height: 50px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .num-btn:active {
      background: #1d4ed8;
    }

    .empty {
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-badge">Enter code to unlock 🔞</div>

    <!-- 5-digit verification boxes -->
    <div class="pin-container">
      <div class="pin-box" id="box-0"></div>
      <div class="pin-box" id="box-1"></div>
      <div class="pin-box" id="box-2"></div>
      <div class="pin-box" id="box-3"></div>
      <div class="pin-box" id="box-4"></div>
    </div>

    <!-- Keypad -->
    <div class="numpad">
      <button class="num-btn" onclick="press('1')">1</button>
      <button class="num-btn" onclick="press('2')">2</button>
      <button class="num-btn" onclick="press('3')">3</button>

      <button class="num-btn" onclick="press('4')">4</button>
      <button class="num-btn" onclick="press('5')">5</button>
      <button class="num-btn" onclick="press('6')">6</button>

      <button class="num-btn" onclick="press('7')">7</button>
      <button class="num-btn" onclick="press('8')">8</button>
      <button class="num-btn" onclick="press('9')">9</button>

      <div class="empty"></div>
      <button class="num-btn" onclick="press('0')">0</button>
      <button class="num-btn" onclick="del()">⌫</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Opens full screen inside Telegram
    }

    let code = "";
    const targetLength = 5;
    const correctCode = "12345"; // Change your secret unlock code here

    function updateUI() {
      for (let i = 0; i < targetLength; i++) {
        document.getElementById(`box-${i}`).innerText = code[i] ? "•" : "";
      }
    }

    function press(num) {
      if (code.length < targetLength) {
        code += num;
        updateUI();
        if (code.length === targetLength) {
          checkCode();
        }
      }
    }

    function del() {
      if (code.length > 0) {
        code = code.slice(0, -1);
        updateUI();
      }
    }

    function checkCode() {
      if (code === correctCode) {
        alert("Success! Code Unlocked.");
      } else {
        alert("Incorrect Code. Try again.");
        code = "";
        updateUI();
      }
    }
  </script>
</body>
</html>
